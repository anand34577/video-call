# Reference config for running coturn natively (docker-compose passes these
# settings as CLI flags instead). If you run coturn with this file, make sure
# static-auth-secret matches TURN_SECRET in the app's .env.

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=changeme-turn-secret

realm=visioncall.lan

# UDP relay port range (open these in the firewall)
min-port=49160
max-port=49200

# Set to your LAN/VPN IP if coturn runs behind NAT (usually not needed on LAN)
# external-ip=192.168.1.50

no-cli
no-tls
no-dtls
log-file=/var/log/turnserver.log
