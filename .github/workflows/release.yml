name: Release

# Push a "vX.Y.Z" tag (or run manually) to publish:
#   - GitHub Release: one archive per platform (binary + .env.example +
#     service installer + README) and checksums.txt
#   - Android APK signed with the release key from the repo secrets
#   - Docker image: ghcr.io/<owner>/<repo>:<tag> and :latest (amd64 + arm64)
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build all platforms
        run: VERSION="$TAG" bash scripts/build.sh

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          for bin in videocall-server-*; do
            plat="${bin#videocall-server-}"; plat="${plat%.exe}"
            pkg="videocall_${TAG}_${plat}"
            mkdir "$pkg"
            cp ../.env.example ../README.md "$pkg/"
            if [[ "$bin" == *.exe ]]; then
              cp "$bin" "$pkg/videocall.exe"
              cp ../scripts/install-service.ps1 "$pkg/"
              zip -qr "$pkg.zip" "$pkg"
            else
              cp "$bin" "$pkg/videocall"
              if [[ "$plat" == linux-* ]]; then
                cp ../scripts/install-linux.sh ../deploy/videocall.service ../deploy/backup.sh \
                  ../deploy/videocall-backup.service ../deploy/videocall-backup.timer "$pkg/"
                chmod +x "$pkg/install-linux.sh" "$pkg/backup.sh" "$pkg/videocall"
              fi
              tar -czf "$pkg.tar.gz" "$pkg"
            fi
          done
          sha256sum videocall_*.tar.gz videocall_*.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/videocall_*.tar.gz
            dist/videocall_*.zip
            dist/checksums.txt

  android:
    # Runs after "binaries" so the GitHub Release already exists and this job
    # only attaches the APK to it.
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set, refusing to publish an unsigned APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # v1.2.3 becomes versionName 1.2.3 and versionCode 10203.
          ver="${TAG#v}"
          IFS=. read -r major minor patch <<< "$ver"
          export VERSION_NAME="$ver" VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          ./gradlew assembleRelease --no-daemon
          apk="videocall_${TAG}_android.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$apk"
          cd .. && sha256sum "$apk" > "$apk.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            videocall_*_android.apk
            videocall_*_android.apk.sha256

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Image name (ghcr needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Only the final alpine stage runs arm64 code (apk add); builds are native.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Vision Call
            org.opencontainers.image.description=Self-hosted chat and video calling for your own network
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
