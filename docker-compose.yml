# Vision Call with Docker Compose.
#
#   docker compose up -d
#   docker compose logs app | grep -i password     # first admin password
#
# Then open https://<this computer's IP>:8443 from any device on your network.
# No configuration is needed. To change a setting, create a .env file next to
# this one (see .env.example) and run `docker compose up -d` again.
name: videocall

services:
  app:
    image: ghcr.io/anand34577/video-call:${VIDEOCALL_VERSION:-latest}
    container_name: videocall
    restart: unless-stopped
    ports:
      - "8443:8443"      # HTTPS web app
      - "8080:8080"      # plain HTTP (Android app, health checks)
      - "7882:7882/udp"  # group-call audio and video
    env_file:
      - path: .env
        required: false
    volumes:
      - videocall-data:/data

  # Optional TURN relay. Only needed when devices can't reach each other
  # directly, such as some VPN meshes or networks split into several subnets.
  # Set TURN_SECRET, TURN_HOST and EXTERNAL_IP in .env first, then start it
  # with:  docker compose --profile turn up -d
  coturn:
    profiles: [turn]
    image: coturn/coturn:4.6
    container_name: videocall-turn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --realm=videocall.lan
      --fingerprint
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --external-ip=${EXTERNAL_IP:-}
      --no-cli
      --no-tls
      --no-dtls
      --log-file=stdout

volumes:
  videocall-data:
